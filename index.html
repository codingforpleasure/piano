<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#15130f">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Optical Piano</title>
<style>
  :root {
    --bg: #15130f;
    --panel: #1e1b16;
    --panel-2: #262218;
    --line: #3a352b;
    --text: #f0ead9;
    --dim: #9a917d;
    --amber: #ffb63d;
    --amber-deep: #8a5a10;
    --teal: #3fd0a4;
    --red: #e2635a;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    max-width: 560px; margin: 0 auto;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
    gap: 10px;
    user-select: none; -webkit-user-select: none;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; padding: 2px 2px 0; }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: 0.06em; }
  h1 span { color: var(--amber); }
  #status {
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em;
    padding: 4px 9px; border-radius: 99px; border: 1px solid var(--line); color: var(--dim);
  }
  #status.live { color: var(--teal); border-color: var(--teal); }
  #status.cal  { color: var(--amber); border-color: var(--amber); }

  #tabs { display: flex; gap: 6px; }
  #tabs .tab {
    flex: 1; background: var(--panel); color: var(--dim);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px;
    font-weight: 600; font-size: 14px;
  }
  #tabs .tab.active { background: var(--panel-2); color: var(--amber); border-color: var(--amber); }
  .panel { display: flex; flex-direction: column; gap: 10px; }
  .panel[hidden] { display: none; }

  #stage {
    position: relative; background: #000; border-radius: 12px; overflow: hidden;
    border: 1px solid var(--line); aspect-ratio: 4 / 3;
  }
  #view { width: 100%; height: 100%; display: block; }
  #prompt {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; text-align: center;
    background: rgba(21,19,15,0.92); padding: 24px;
  }
  #prompt p { color: var(--dim); font-size: 14px; line-height: 1.5; max-width: 320px; }
  .camNote { font-size: 12px; color: var(--dim); min-height: 15px; line-height: 1.4; }
  .camNote:empty { display: none; }
  #guide {
    position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 14px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    font-size: 14px; line-height: 1.4; min-height: 44px;
  }
  #guide b { color: var(--amber); }

  #keys { display: flex; gap: 4px; height: 92px; }
  .key {
    flex: 1; position: relative; border-radius: 6px; overflow: hidden;
    background: var(--panel); border: 1px solid var(--line);
    display: flex; align-items: flex-end; justify-content: center;
    transition: border-color 80ms;
  }
  .key .fill {
    position: absolute; left: 0; right: 0; bottom: 0; height: 0%;
    background: var(--amber-deep); transition: height 60ms linear;
  }
  .key.on { border-color: var(--amber); }
  .key.on .fill { background: var(--amber); }
  .key .lbl {
    position: relative; font-family: var(--mono); font-size: 11px;
    color: var(--dim); padding-bottom: 6px;
  }
  .key.on .lbl { color: #241a05; font-weight: 700; }
  .key.uncal { opacity: 0.35; }
  .key.hit::after {
    content: ""; position: absolute; top: 4px; right: 4px;
    width: 7px; height: 7px; border-radius: 50%; background: var(--teal);
  }
  .key.hit .lbl { color: var(--teal); }

  #controls, .controls { display: flex; flex-direction: column; gap: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .row { display: flex; align-items: center; gap: 10px; }
  .row label { font-size: 13px; color: var(--dim); min-width: 84px; }
  .row output { font-family: var(--mono); font-size: 12px; color: var(--text); min-width: 30px; text-align: right; }
  input[type=range] { flex: 1; accent-color: var(--amber); height: 28px; }
  select {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 10px; font-size: 14px;
  }
  button {
    font: inherit; font-weight: 600; border: none; border-radius: 10px;
    padding: 13px 18px; cursor: pointer; touch-action: manipulation;
  }
  .primary { background: var(--amber); color: #241a05; }
  .primary:active { filter: brightness(0.9); }
  .ghost { background: var(--panel-2); color: var(--text); border: 1px solid var(--line); padding: 10px 14px; font-weight: 500; font-size: 14px; }
  .btnrow { display: flex; gap: 8px; }
  .btnrow .primary { flex: 1; }
  #err { color: var(--red); font-size: 13px; line-height: 1.4; display: none; padding: 0 2px; }

  #capture { display: none; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  #capture h2 { font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: 0.04em; margin-bottom: 8px; }
  #shots { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #shots a { position: relative; display: block; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); }
  #shots img { width: 100%; height: auto; display: block; }
  #shots span { position: absolute; top: 2px; left: 4px; font: 700 10px var(--mono); color: var(--amber); text-shadow: 0 0 3px #000; }
  #clip { margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }
  #clip video { width: 100%; border-radius: 8px; background: #000; }
  #capture .save { align-self: flex-start; background: var(--amber); color: #241a05; font-weight: 600; text-decoration: none; border: none; cursor: pointer; border-radius: 8px; padding: 8px 14px; font-size: 13px; }
  #saveAll { display: inline-block; margin-bottom: 10px; }
  #capture .hint { font-size: 11px; color: var(--dim); margin-top: 8px; }

  footer { font-size: 11px; color: var(--dim); text-align: center; font-family: var(--mono); }
</style>
</head>
<body>
<header>
  <h1>OPTICAL<span>—</span>PIANO</h1>
  <div id="status">off</div>
</header>

<nav id="tabs">
  <button class="tab active" data-tab="play" type="button">Play</button>
  <button class="tab" data-tab="notes" type="button">Notes</button>
</nav>

<section id="tab-play" class="panel">
  <div class="controls">
    <div class="row">
      <label for="facing">Camera</label>
      <select id="facing">
        <option value="environment">Back camera</option>
        <option value="user" selected>Front camera</option>
      </select>
      <button class="ghost" id="detectBtn" type="button">List all cameras</button>
    </div>
    <div class="row" id="zoomRow" hidden>
      <label for="zoom">Zoom</label>
      <input type="range" id="zoom">
      <output id="zoomOut"></output>
    </div>
    <div id="camNote" class="camNote"></div>
  </div>

  <div id="stage">
    <canvas id="view" width="640" height="480"></canvas>
    <div id="guide"></div>
    <div id="prompt">
      <p>Tap start, then tap Calibrate and close the phone in the box (camera facing the holes). Calibration begins after a 10-second countdown.</p>
      <button class="primary" id="startBtn">Start camera &amp; sound</button>
    </div>
  </div>

  <div id="controls">
    <div class="row">
      <label for="sens">Sensitivity</label>
      <input type="range" id="sens" min="8" max="60" value="30">
      <output id="sensOut">1.00×</output>
    </div>
    <div class="row">
      <label for="soundSet">Sound</label>
      <select id="soundSet">
        <option value="xylophone" selected>Xylophone</option>
        <option value="default">Default (synth)</option>
      </select>
    </div>
    <div class="row">
      <label for="coverChk">Play note only when covering the hole</label>
      <input type="checkbox" id="coverChk">
    </div>
    <div class="row">
      <label for="dbgChk">Show detection</label>
      <input type="checkbox" id="dbgChk" checked>
      <output id="dbgOut">—</output>
    </div>
    <div class="btnrow">
      <button class="primary" id="calBtn" disabled>Calibrate</button>
      <button class="primary" id="shotBtn" disabled>Take shot</button>
    </div>
    <div class="btnrow">
      <button class="ghost" id="logBtn" type="button">Download logs (.txt)</button>
    </div>
  </div>

  <div id="err"></div>
  <div id="capture"></div>
</section>

<section id="tab-notes" class="panel" hidden>
  <div id="keys"></div>
  <div class="controls">
    <div class="row">
      <label for="numKeys">Keys</label>
      <select id="numKeys">
        <option>3</option><option>4</option><option selected>5</option><option>6</option>
        <option>7</option><option>8</option><option>10</option>
      </select>
      <button class="ghost" id="toneBtn" type="button">Test sound</button>
    </div>
  </div>
</section>

<footer>keep the room lit · keep the box dark · v0.1 shoebox</footer>

<script>
"use strict";
/* ============================================================================
   OPTICAL PIANO — single-file PWA. Sections in order:
     1. constants   2. state      3. dom        4. audio
     5. key strip   6. camera     7. pixels     8. calibration
     9. play detect 10. render    11. main loop 12. wiring
   ========================================================================== */

/* ---------- 1. constants ---------- */
const PW = 160, PH = 120;               // processing resolution
const NAMES = ["C4","D4","E4","F4","G4","A4","B4","C5","D5","E5"];
const FREQS = [261.63,293.66,329.63,349.23,392.00,440.00,493.88,523.25,587.33,659.25];
const REMOVE_DELTA = 70;                 // removal needs the frame this much brighter than its ADAPTIVE baseline...
const REMOVE_ABS   = 150;                // ...AND this bright in absolute terms (a real flood of room light), so exposure drift in a dark box can't trip it
const REMOVE_FRAMES = 8;                  // ...sustained this many frames, so a blip can't lock play into "removed"
const DARK_EMA     = 0.03;               // the removal baseline slowly follows auto-exposure drift instead of a one-shot capture
const CAL_IDLE_MS = 4000;                // sealed box has no button: auto-finish calibration after this idle gap
const PLAY_DELAY_S = 10;                  // after the success clip, wait this long before play mode starts
// --- play detection (find-the-light-and-name-it), all in the 160x120 processing frame ---
const SAT_FLOOR   = 200;                 // a lit hole saturates well past this; dim diffuse "between holes" frames don't
const GAP_MIN     = 95;                   // lit peak must beat the frame's OWN background by this (at gain 1) -> auto-exposure-proof
const PEAK_BAND   = 35;                   // centroid uses pixels within this of the peak (the near-saturated core)
const CENTROID_R  = 18;                   // px search radius around the brightest pixel
const MAX_MAP_DIST = 35;                  // if the light lands farther than this from every hole, ignore it
const SWITCH_FRAMES = 2;                  // a new winner must persist this many frames before the note switches
const DARK_CEIL   = 130;                  // cover mode: a covered hole's darkest pixel must be at most this (plus clear the gap)
const CLUSTER_R   = 12;                   // calibration: centroids within this many px are the same hole
const CAL_MIN_HITS = 2;                   // calibration: a hole must be seen this many frames to count (rejects noise)

/* ---------- 2. state ---------- */
let mode = "idle";                       // idle | calibrate | ready | play | removed
let numKeys = 5;
let zones = [];                          // {x,y,w,h, cx,cy, pressed, note, freq, name}
let clusters = [];                        // calibration: running {cx,cy,hits} position clusters, one per hole
let lastCalHit = 0;                       // timestamp of last hole activity, for hands-free auto-finish
let playTimer = null;                     // countdown from calibration-success to play mode
let gain = 1.0;                           // sensitivity = light gain (ISO-style): brightens footage AND scales detection
let coverMode = false;                     // false = play when a hole is UNCOVERED (lit); true = play when COVERED (dark)
let soundset = "xylophone";                 // "default" = synth voices; "xylophone" = embedded samples
let reachedOrder = [];                    // note indices reached this session, in order
let darkMean = 0;                         // mean frame luma inside the closed box (removal reference)

/* ---------- 3. dom ---------- */
const $ = id => document.getElementById(id);
const view = $("view"), vctx = view.getContext("2d");
const proc = document.createElement("canvas"); proc.width = PW; proc.height = PH;
const pctx = proc.getContext("2d", { willReadFrequently: true });
const video = document.createElement("video");
video.playsInline = true; video.muted = true;
const statusEl = $("status"), guideEl = $("guide"), errEl = $("err");

function setStatus(txt, cls) { statusEl.textContent = txt; statusEl.className = cls || ""; log("status", { txt, cls: cls || "" }); }
function setGuide(html) { guideEl.innerHTML = html; }
function showErr(msg) { errEl.style.display = "block"; errEl.textContent = msg; log("ERROR shown", msg); }

/* ---------- 3b. logging (downloadable text log of the whole flow) ---------- */
const APP_VERSION = "v28";
const LOG = [];
const LOG_MAX = 8000;                     // ring-buffer cap so long sessions can't exhaust memory
const T0 = (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
function nowMs() { return ((typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now()) - T0; }
function log(msg, data) {
  const t = (nowMs() / 1000).toFixed(2).padStart(8);
  let line = `[${t}s] ${msg}`;
  if (data !== undefined) {
    try { line += "  " + (typeof data === "object" ? JSON.stringify(data) : String(data)); }
    catch (_) { line += "  [unserializable]"; }
  }
  LOG.push(line);
  if (LOG.length > LOG_MAX) LOG.shift();
  if (window.console && console.log) console.log(line);
}
function downloadLogs() {
  const header = [
    "Optical Piano — session log",
    "app       : " + APP_VERSION,
    "generated : " + new Date().toISOString(),
    "userAgent : " + navigator.userAgent,
    "screen    : " + screen.width + "x" + screen.height + "  dpr " + (window.devicePixelRatio || 1),
    "entries   : " + LOG.length,
    "-".repeat(64)
  ].join("\n");
  const text = header + "\n" + LOG.join("\n") + "\n";
  const blob = new Blob([text], { type: "text/plain" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "optical-piano-log.txt";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  log("logs downloaded", { entries: LOG.length });
}

/* ---------- 4. audio ---------- */
let actx = null, master = null;
const voices = [];

function initAudio() {
  actx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: "interactive" });
  master = actx.createGain();
  master.gain.value = 0.5;
  master.connect(actx.destination);
  log("audio initialised", { sampleRate: actx.sampleRate, state: actx.state });
}
function makeVoice(freq) {
  const g = actx.createGain(); g.gain.value = 0; g.connect(master);
  const o1 = actx.createOscillator(); o1.type = "triangle"; o1.frequency.value = freq;
  const o2 = actx.createOscillator(); o2.type = "sine"; o2.frequency.value = freq * 2.001;
  const g2 = actx.createGain(); g2.gain.value = 0.25;
  o1.connect(g); o2.connect(g2); g2.connect(g);
  o1.start(); o2.start();
  return { g };
}
function noteOn(i) {
  if (soundset === "xylophone" && playSample(i)) return;   // sample instrument: one-shot, ignore the synth voice
  const v = voices[i]; if (!v) return;
  const t = actx.currentTime;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(v.g.gain.value, t);
  v.g.gain.linearRampToValueAtTime(0.9 / Math.max(3, numKeys) * 3, t + 0.01);
}
function noteOff(i) {
  if (soundset === "xylophone") return;                    // samples ring out and decay on their own
  const v = voices[i]; if (!v) return;
  const t = actx.currentTime;
  v.g.gain.cancelScheduledValues(t);
  v.g.gain.setValueAtTime(v.g.gain.value, t);
  v.g.gain.exponentialRampToValueAtTime(0.0008, t + 0.3);
  v.g.gain.setValueAtTime(0, t + 0.32);
}
function blip(i, dur = 0.25) { noteOn(i); setTimeout(() => noteOff(i), dur * 1000); }
// Short UI beep, independent of the piano voices (used by the countdown).
function beep(freq = 880, dur = 0.08, vol = 0.3) {
  if (!actx) return;
  const t = actx.currentTime;
  const o = actx.createOscillator(); o.type = "square"; o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(master);
  o.start(t); o.stop(t + dur + 0.02);
}
// Distinct rising cue: the countdown finished, calibration is starting now.
function beepStart() {
  beep(660, 0.1);
  setTimeout(() => beep(990, 0.1), 120);
  setTimeout(() => beep(1320, 0.18), 240);
}
// Distinct higher/faster cue: calibration finished, play mode is live — you hear this from inside the box.
function beepDone() {
  beep(880, 0.09);
  setTimeout(() => beep(1320, 0.09), 90);
  setTimeout(() => beep(1760, 0.18), 180);
}

  if (!actx || calBuffer || calDecoding) { log("decodeCalAudio skipped", { hasAudio: !!actx, decoded: !!calBuffer, decoding: calDecoding }); return; }
  calDecoding = true;
  log("decoding success clip…");
  const bin = atob(CAL_SUCCESS_URL.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  actx.decodeAudioData(bytes.buffer,
    buf => { calBuffer = buf; calDecoding = false; log("success clip decoded", { seconds: +buf.duration.toFixed(2) }); },
    err => { calDecoding = false; log("success clip DECODE FAILED — will use beep fallback", String(err)); });
}
function playCalSuccess() {
  if (actx && calBuffer) {
    const src = actx.createBufferSource();
    src.buffer = calBuffer;
    const g = actx.createGain(); g.gain.value = 0.9;
    src.connect(g); g.connect(actx.destination);
    src.start();
    log("playing success clip (Web Audio)", { seconds: +calBuffer.duration.toFixed(2) });
    return;
  }
  log("success clip not ready — beep fallback", { hasAudio: !!actx, decoded: !!calBuffer });
  beepDone();                                  // not decoded yet / unavailable → audible fallback
}
function rebuildVoices() {
  voices.length = 0;
  for (let i = 0; i < numKeys; i++) voices.push(makeVoice(FREQS[i]));
  log("voices rebuilt", { numKeys });
}

const xyloBuffers = [];
function decodeXyloSamples() {
  if (!actx || xyloBuffers.length) return;
  log("decoding xylophone samples", { count: XYLO_SAMPLES.length });
  XYLO_SAMPLES.forEach((url, i) => {
    const bin = atob(url.split(",")[1]);
    const bytes = new Uint8Array(bin.length);
    for (let j = 0; j < bin.length; j++) bytes[j] = bin.charCodeAt(j);
    actx.decodeAudioData(bytes.buffer,
      buf => { xyloBuffers[i] = buf; },
      () => log("xylophone sample decode failed", { i, note: XYLO_NAMES[i] }));
  });
}
// Play the sample mapped to note index i. Returns false if there's no sample (caller falls back to synth).
function playSample(i) {
  const buf = xyloBuffers[i];
  if (!buf || !actx) return false;
  const src = actx.createBufferSource();
  src.buffer = buf;
  const g = actx.createGain(); g.gain.value = 0.9;
  src.connect(g); g.connect(actx.destination);
  src.start();
  return true;
}

/* ---------- 5. key strip ---------- */
const keysEl = $("keys");
let keyEls = [];
function buildKeyStrip() {
  keysEl.innerHTML = "";
  keyEls = [];
  for (let i = 0; i < numKeys; i++) {
    const k = document.createElement("div");
    k.className = "key uncal";
    k.innerHTML = `<div class="fill"></div><div class="lbl">${NAMES[i]}</div>`;
    k.addEventListener("pointerdown", () => { if (actx) blip(i); });
    keysEl.appendChild(k);
    keyEls.push(k);
  }
}

/* ---------- 6. camera ---------- */
let cameraOn = false;
let curTrack = null;                        // active video track, for zoom/applyConstraints
function stopStream() {
  const s = video.srcObject;
  if (s) s.getTracks().forEach(t => t.stop());
  video.srcObject = null;
}
// Size the canvas + stage to the camera's real frame so it isn't stretched to a fixed 4:3.
function fitPreview() {
  const w = video.videoWidth, h = video.videoHeight;
  if (!w || !h) return;
  view.width = w; view.height = h;
  $("stage").style.aspectRatio = `${w} / ${h}`;
  log("preview fitted to camera frame", { w, h });
}
async function startCamera() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showErr("Camera API unavailable. Open this page over HTTPS (e.g. a Netlify or GitHub Pages link) — camera access is blocked on plain file:// or http://.");
    return false;
  }
  try {
    stopStream();                                  // release any current camera before switching
    const sel = $("facing").value;
    log("startCamera requested", { selection: sel });
    // "environment"/"user" → pick by facing; anything else is a specific deviceId (e.g. ultra-wide).
    const base = { width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 60 } };
    const videoConstraints = (sel === "environment" || sel === "user")
      ? { ...base, facingMode: sel }
      : { ...base, deviceId: { exact: sel } };
    const stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: videoConstraints });
    video.srcObject = stream;
    await video.play();
    // Note: no manual exposure lock — locking to "manual" without an exposureTime
    // blacks the image out instantly on many devices. Auto-exposure is fine because the
    // play detector gates each hole against the frame's OWN background every frame.
    fitPreview();                                   // match canvas + stage to the real frame aspect
    cameraOn = true;
    const tr = stream.getVideoTracks()[0], s = tr ? tr.getSettings() : {};
    curTrack = tr;
    log("camera started", { label: tr && tr.label, w: s.width, h: s.height, fps: s.frameRate });
    // Zoom capability: on Android the logical back camera often reaches the ultra-wide at zoom < 1.
    const cap = tr && tr.getCapabilities ? tr.getCapabilities() : {};
    const z = cap && cap.zoom;
    const zr = $("zoomRow"), zi = $("zoom");
    let engagedWide = false;
    if (z && z.max > z.min) {
      zi.min = z.min; zi.max = z.max; zi.step = z.step || 0.1;
      // Default to the widest zoom (< 1x) so it starts on the ULTRA-WIDE lens automatically.
      const target = (z.min < 1) ? z.min : (s.zoom != null ? s.zoom : Math.min(1, z.max));
      if (z.min < 1) {
        try { await tr.applyConstraints({ advanced: [{ zoom: target }] }); engagedWide = true; log("ultra-wide engaged by default", { zoom: target }); }
        catch (err) { log("default ultra-wide zoom failed", String(err && err.message || err)); }
      }
      zi.value = target; $("zoomOut").textContent = (+target).toFixed(1) + "×";
      zr.hidden = false;
    } else {
      zr.hidden = true;
    }
    const wideHint = engagedWide
      ? ` <b>Ultra-wide engaged</b> at ${z.min}× — use the <b>Zoom</b> slider to change.`
      : (z && z.min < 1) ? ` Reaches ${z.min}× — slide <b>Zoom</b> down for ultra-wide.`
      : ` No sub-1× zoom, so the ultra-wide lens isn't reachable in the browser here.`;
    $("camNote").innerHTML = `Active: <b>${(tr && tr.label) || "camera"}</b> · ${s.width || "?"}×${s.height || "?"}.` + wideHint;
    return true;
  } catch (e) {
    log("startCamera FAILED", String(e && e.message || e));
    showErr("Camera permission denied or unavailable: " + e.message);
    return false;
  }
}

/* Detect cameras and, if an ultra-wide lens is present, add it to the picker.
   Labels are only revealed after camera permission, so grab a throwaway stream first. */
async function detectCameras() {
  const note = $("camNote");
  if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) {
    note.textContent = "Camera list not available in this browser."; return;
  }
  note.textContent = "Scanning cameras…";
  log("detectCameras: scanning");
  try {
    let devices = await navigator.mediaDevices.enumerateDevices();
    if (!devices.some(d => d.kind === "videoinput" && d.label)) {
      const s = await navigator.mediaDevices.getUserMedia({ video: true });
      s.getTracks().forEach(t => t.stop());           // permission only; release it immediately
      devices = await navigator.mediaDevices.enumerateDevices();
    }
    const cams = devices.filter(d => d.kind === "videoinput");
    log("cameras enumerated", { count: cams.length, labels: cams.map(c => c.label) });

    // List EVERY camera by deviceId. On Android, facingMode:"environment" only ever returns the
    // MAIN back lens — the ultra-wide is reachable only by its specific deviceId — and the labels
    // are generic ("camera N, facing back"), so we can't auto-pick it. Expose them all and let the
    // user choose the widest "facing back" one.
    const sel = $("facing");
    sel.querySelectorAll("option.devOpt").forEach(o => o.remove());   // clear any previous scan
    let backCount = 0;
    cams.forEach((cam, i) => {
      const label = cam.label || `Camera ${i + 1}`;
      if (/back|environment/i.test(label)) backCount++;
      const o = document.createElement("option");
      o.className = "devOpt"; o.value = cam.deviceId; o.textContent = label;
      sel.appendChild(o);
    });

    // If a label actually names the ultra-wide (iOS does: "Back Ultra Wide Camera"), auto-select it.
    const uw = cams.find(d => /ultra|0[.,]5/i.test(d.label) && !/tele|zoom|front|user/i.test(d.label));
    if (uw) {
      sel.value = uw.deviceId;
      sel.dispatchEvent(new Event("change"));        // switch live if the camera is already running
      note.innerHTML = `Ultra-wide found and selected. (${cams.length} cameras listed)`;
    } else {
      note.innerHTML = `Listed <b>${cams.length}</b> camera${cams.length === 1 ? "" : "s"} (${backCount} back). Android hides lens names, so open each <b>"facing back"</b> entry and keep the one with the <b>widest</b> view — that's the ultra-wide.`;
    }
  } catch (e) {
    note.textContent = "Couldn't list cameras: " + e.message;
  }
}
async function keepAwake() {
  try { if ("wakeLock" in navigator) { await navigator.wakeLock.request("screen"); log("wake lock acquired"); } }
  catch (e) { log("wake lock failed", String(e && e.message || e)); }
}
document.addEventListener("visibilitychange", () => {
  log("visibility changed", { hidden: document.hidden, audioState: actx && actx.state });
  if (!document.hidden) keepAwake();
});

/* ---------- 7. pixel helpers ---------- */
function grabFrame() {
  pctx.drawImage(video, 0, 0, PW, PH);
  return pctx.getImageData(0, 0, PW, PH).data;
}
function lumaAt(d, p) { const q = p * 4; return (2 * d[q] + 5 * d[q + 1] + d[q + 2]) >> 3; }
function frameMeanLuma(d) {
  let sum = 0; const N = PW * PH;
  for (let p = 0; p < N; p++) sum += lumaAt(d, p);
  return sum / N;
}

/* ---------- 8. calibration ---------- */
function startCalibration() {
  zones = [];
  clusters = [];
  reachedOrder = [];
  mode = "calibrate";
  lastCalHit = Date.now();
  setStatus("calibrating", "cal");
  keyEls.forEach(k => k.className = "key uncal");
  setGuide("Sweep the window slowly across <b>all</b> the holes…");
  log("=== CALIBRATION started (sweep mode) ===", { expectHoles: numKeys });
}

/* Auto-calibrate countdown: gives you time to close the phone in the box. */
let countdownTimer = null;
function cancelCountdown() {
  if (countdownTimer) { clearInterval(countdownTimer); countdownTimer = null; }
}
function startCountdown(secs = 10) {
  cancelCountdown();
  cancelPlayCountdown();                    // drop any pending success→play grace from a prior run
  log("pre-calibration countdown started", { seconds: secs });
  let left = secs;
  const tick = () => {
    setGuide(`Close the phone in the box — calibrating in <b>${left}</b>s…`);
    beep(left <= 3 ? 1320 : 880, 0.07);    // higher, more urgent in the final 3 seconds
  };
  setStatus("closing…", "cal");
  tick();
  countdownTimer = setInterval(() => {
    if (--left > 0) { tick(); return; }
    cancelCountdown();
    beepStart();                           // audible "starting now" cue
    startCalibration();                    // box is closed by now → begin the sweep
    startCapture();                        // photos every second + footage, through calibration
  }, 1000);
}
// Calibration by SWEEP (not press-per-key): you slide the single window across every hole once.
// Each frame we locate the lit hole exactly like play does, then fold its centroid into a running
// position cluster. Holes are discovered as distinct clusters — no per-key press/release timing,
// which is what broke with a continuous sweep (only the first hole ever registered). When no hole
// has been seen for CAL_IDLE_MS, we finalise: order the clusters along the line and assign notes.
function calibrationStep(d) {
  const now = Date.now();
  const L = findLight(d);

  if (L.lit) {
    let best = Infinity, bi = -1;
    for (let i = 0; i < clusters.length; i++) {
      const c = clusters[i], dx = L.cx - c.cx, dy = L.cy - c.cy, dd = dx * dx + dy * dy;
      if (dd < best) { best = dd; bi = i; }
    }
    if (bi >= 0 && best <= CLUSTER_R * CLUSTER_R) {   // same hole → refine its running average
      const c = clusters[bi];
      c.cx = (c.cx * c.hits + L.cx) / (c.hits + 1);
      c.cy = (c.cy * c.hits + L.cy) / (c.hits + 1);
      c.hits++;
    } else {                                          // a new hole
      clusters.push({ cx: L.cx, cy: L.cy, hits: 1 });
      blip(Math.min(clusters.length - 1, numKeys - 1), 0.16);   // play THIS hole's note as it's found
      log("calibration: NEW hole found", { index: clusters.length - 1, x: Math.round(L.cx), y: Math.round(L.cy), mx: L.mx, gap: Math.round(L.mx - L.bg) });
    }
    lastCalHit = now;
    const solid = clusters.filter(c => c.hits >= CAL_MIN_HITS).length;
    setGuide(`Sweeping… found <b>${solid}</b> hole${solid === 1 ? "" : "s"} so far.`);
  } else if (clusters.some(c => c.hits >= CAL_MIN_HITS) && now - lastCalHit > CAL_IDLE_MS) {
    log("calibration idle → finalising", { clusters: clusters.length });
    finalizeCalibration();
  }

  if (showDetect) buildDetectOverlay(d, L.mx, L.bg, L.lit, L.cx, L.cy, -1);
}

// Turn the swept clusters into ordered, note-mapped holes and start playing.
function finalizeCalibration() {
  let cs = clusters.filter(c => c.hits >= CAL_MIN_HITS);   // drop noise blips
  if (!cs.length) cs = clusters.slice();
  cs.sort((a, b) => (a.cy - b.cy) || (a.cx - b.cx));       // vertical line: top → bottom
  cs = cs.slice(0, numKeys);
  const W = 16;
  zones = cs.map((c, i) => ({
    x: Math.max(0, Math.round(c.cx - W / 2)), y: Math.max(0, Math.round(c.cy - W / 2)),
    w: W, h: W, cx: c.cx, cy: c.cy,
    note: i, freq: FREQS[i], name: NAMES[i], pressed: false
  }));
  keyEls.forEach(k => k.classList.add("uncal"));
  zones.forEach(z => keyEls[z.note]?.classList.remove("uncal"));
  log("=== CALIBRATION done ===", { holes: zones.length, notes: zones.map(z => ({ note: NAMES[z.note], x: Math.round(z.cx), y: Math.round(z.cy) })) });

  // Success! Hold in "ready" (no notes trigger yet). Play the clip and, starting at the SAME
  // moment, run the 10s grace; play mode begins 10s after the clip starts.
  mode = "ready";
  setStatus("get ready", "cal");
  // confirm the mapping by ear under the clip: each hole's note in order, low → high
  zones.forEach((z, i) => setTimeout(() => blip(z.note, 0.18), 400 + i * 220));
  playCalSuccess();
  log("success clip + 10s grace started");
  startPlayCountdown(PLAY_DELAY_S);           // 10s counted from the clip start
}

function cancelPlayCountdown() {
  if (playTimer) { clearInterval(playTimer); playTimer = null; }
}
// Audible countdown (phone is in the box) from calibration success into play mode.
function startPlayCountdown(secs) {
  cancelPlayCountdown();
  let left = secs;
  const tick = () => {
    setGuide(`Play starts in <b>${left}</b>s…`);
    beep(left <= 3 ? 1320 : 880, 0.06);      // more urgent in the final 3 seconds
  };
  tick();
  playTimer = setInterval(() => {
    if (--left > 0) { tick(); return; }
    cancelPlayCountdown();
    enterPlay();                             // now exposing holes plays their notes
  }, 1000);
}
function enterPlay() {
  mode = "play";
  beepDone();                               // "play now" cue — heard from inside the box when the grace ends
  setStatus("live", "live");
  setGuide(`Play! Lift the phone out of the box to see which keys were reached.`);
  const d = grabFrame();
  zones.forEach(z => { z.pressed = false; });
  resetDetection();
  darkMean = frameMeanLuma(d);              // brightness reference of the closed, dark box (removal detection)
  clearReached();
  log("=== PLAY mode live ===", { holes: zones.length, darkMean: Math.round(darkMean), removalNeeds: `>${Math.round(darkMean) + REMOVE_DELTA} AND >${REMOVE_ABS}` });
}

/* Latch a key as "reached" (persists until the next calibration). */
function recordReached(note) {
  if (reachedOrder.includes(note)) return;
  reachedOrder.push(note);
  keyEls[note]?.classList.add("hit");
  log("key reached (first time)", { note: NAMES[note], order: reachedOrder.length });
}
function clearReached() {
  reachedOrder = [];
  keyEls.forEach(k => k.classList.remove("hit"));
}

/* Phone lifted out of the box: freeze so the flood of light can't overwrite the
   record, silence everything, and show which keys were reached. */
function handleRemoval() {
  log("REMOVAL detected — leaving play mode", { reached: reachedOrder.map(n => NAMES[n]) });
  mode = "removed";
  if (activeNote >= 0) noteOff(activeNote);
  resetDetection();
  zones.forEach(z => { z.pressed = false; });
  keyEls.forEach(k => { k.classList.remove("on"); const f = k.querySelector(".fill"); if (f) f.style.height = "0%"; });
  setStatus("out of box");
  const list = reachedOrder.length ? reachedOrder.map(n => NAMES[n]).join(" → ") : "none";
  setGuide(`Out of the box — keys reached: <b>${list}</b>. Tap <b>Calibrate</b> to run again.`);
}

/* ---------- 8b. diagnostic capture (photos + video during calibration) ---------- */
const CAP_SECONDS = 15;
const shot = document.createElement("canvas");
const shotCtx = shot.getContext("2d");
let capTimer = null, capShots = 0, recorder = null, recChunks = [];
const photos = [];                                 // { name, data:Uint8Array } for the zip

// Reset the gallery panel and return it ready for fresh shots.
function resetGallery(title) {
  if (capTimer) { clearInterval(capTimer); capTimer = null; }
  stopRecording();
  photos.length = 0;
  const gal = $("capture");
  gal.style.display = "block";
  gal.innerHTML = `<h2>${title}</h2>` +
    `<button id="saveAll" class="save" type="button">Save all photos (.zip)</button>` +
    `<div id="shots"></div>`;
  $("saveAll").addEventListener("click", saveAllPhotos);
}

function startCapture() {
  log("diagnostic capture started", { photos: CAP_SECONDS, seconds: CAP_SECONDS });
  resetGallery(`CAPTURE — ${CAP_SECONDS} photos + footage`);
  capShots = 0;
  captureFrame();                                  // first photo at t=0
  capTimer = setInterval(() => {
    captureFrame();
    if (++capShots >= CAP_SECONDS - 1) { clearInterval(capTimer); capTimer = null; }
  }, 1000);

  startRecording();
  setTimeout(stopRecording, CAP_SECONDS * 1000);
}

// Single photo (used by the "Take shot" button).
function takeShot() {
  log("single shot captured");
  resetGallery("SINGLE SHOT");
  captureFrame();
}

// 5-second countdown, then grab one photo. Assumes the camera is already running.
let shotTimer = null;
function startShotCountdown(secs = 5) {
  if (!video.srcObject) { setGuide("Start the camera first."); return; }
  if (shotTimer) clearInterval(shotTimer);
  cancelCountdown();                               // don't clash with a calibration countdown
  let left = secs;
  const tick = () => {
    setGuide(`Taking a shot in <b>${left}</b>s…`);
    beep(left <= 2 ? 1320 : 880, 0.07);
  };
  setStatus("shot…", "cal");
  tick();
  shotTimer = setInterval(() => {
    if (--left > 0) { tick(); return; }
    clearInterval(shotTimer); shotTimer = null;
    beepStart();
    takeShot();
    setStatus(mode === "play" ? "live" : "camera on", mode === "play" ? "live" : "");
    setGuide(`Shot taken — see it in the gallery below.`);
  }, 1000);
}

function captureFrame() {
  const w = video.videoWidth || 640, h = video.videoHeight || 480;
  shot.width = w; shot.height = h;
  shotCtx.drawImage(video, 0, 0, w, h);            // full-res, exactly what the camera sees
  const url = shot.toDataURL("image/jpeg", 0.85);
  const n = document.querySelectorAll("#shots a").length + 1;
  const name = `frame-${String(n).padStart(2, "0")}.jpg`;
  photos.push({ name, data: dataUrlToBytes(url) });
  const a = document.createElement("a");
  a.href = url; a.download = name;
  a.title = `Photo ${n} — tap to save`;
  a.innerHTML = `<img src="${url}" alt="frame ${n}"><span>${n}</span>`;
  $("shots").appendChild(a);
}

/* Save every captured photo as one .zip (store method — JPEGs are already compressed).
   Built by hand so there's no external dependency and it works offline. */
function saveAllPhotos() {
  if (!photos.length) { log("save photos: none to save"); return; }
  log("saving photos zip", { count: photos.length });
  const blob = new Blob([buildZip(photos)], { type: "application/zip" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "box-photos.zip";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}
function dataUrlToBytes(url) {
  const bin = atob(url.split(",")[1]);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
const CRC_TABLE = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();
function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}
function buildZip(files) {
  const u16 = v => new Uint8Array([v & 255, (v >> 8) & 255]);
  const u32 = v => new Uint8Array([v & 255, (v >> 8) & 255, (v >> 16) & 255, (v >>> 24) & 255]);
  const cat = arrs => {
    let len = 0; for (const a of arrs) len += a.length;
    const out = new Uint8Array(len);
    let p = 0; for (const a of arrs) { out.set(a, p); p += a.length; }
    return out;
  };
  const enc = new TextEncoder();
  const DOS_TIME = 0, DOS_DATE = ((2024 - 1980) << 9) | (1 << 5) | 1;   // valid stamp (2024-01-01)
  const locals = [], central = [];
  let offset = 0;
  for (const f of files) {
    const name = enc.encode(f.name), data = f.data, crc = crc32(data);
    const local = cat([
      u32(0x04034b50), u16(20), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
      u32(crc), u32(data.length), u32(data.length), u16(name.length), u16(0), name, data
    ]);
    central.push(cat([
      u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(DOS_TIME), u16(DOS_DATE),
      u32(crc), u32(data.length), u32(data.length),
      u16(name.length), u16(0), u16(0), u16(0), u16(0), u32(0), u32(offset), name
    ]));
    locals.push(local);
    offset += local.length;
  }
  const cd = cat(central);
  const end = cat([
    u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
    u32(cd.length), u32(offset), u16(0)
  ]);
  return cat([...locals, cd, end]);
}

function startRecording() {
  recChunks = [];
  const stream = video.srcObject;
  if (!stream || typeof MediaRecorder === "undefined") { log("recording unavailable (no MediaRecorder/stream)"); return; }   // video is best-effort
  try {
    recorder = new MediaRecorder(stream, pickMime());
    recorder.ondataavailable = e => { if (e.data && e.data.size) recChunks.push(e.data); };
    recorder.onstop = finishRecording;
    recorder.start();
    log("recording started", pickMime());
  } catch (e) { recorder = null; log("recording failed to start", String(e)); }
}
function pickMime() {
  const types = ["video/mp4", "video/webm;codecs=vp9", "video/webm"];
  for (const t of types) if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(t)) return { mimeType: t };
  return {};
}
function stopRecording() { if (recorder && recorder.state !== "inactive") recorder.stop(); }
function finishRecording() {
  if (!recChunks.length) { log("recording finished with no data"); return; }
  log("recording finished", { chunks: recChunks.length });
  const blob = new Blob(recChunks, { type: recChunks[0].type || "video/webm" });
  const url = URL.createObjectURL(blob);
  const ext = blob.type.includes("mp4") ? "mp4" : "webm";
  const wrap = document.createElement("div");
  wrap.id = "clip";
  wrap.innerHTML =
    `<video src="${url}" controls playsinline></video>` +
    `<a class="save" href="${url}" download="box-footage.${ext}">Save video</a>` +
    `<div class="hint">Tap any photo above to save it. Photos + video captured during calibration.</div>`;
  $("capture").appendChild(wrap);
}

/* ---------- 9. play-mode detection ---------- */
// ASSUMPTION (confirmed against the physical rig): exactly ONE hole is ever lit at a time — a
// single sliding window uncovers one hole. So instead of testing 5 zones independently, we find
// the single brightest spot in the frame and map it to the nearest calibrated hole. Measured from
// real box footage: a lit hole saturates (~255) while the wall is mid-grey (~130) and DRIFTS with
// auto-exposure. Gating the peak against the frame's OWN background each frame makes this
// exposure-proof, and taking one brightest blob ignores the glow that bleeds between holes.
let activeNote = -1;                       // note currently sounding (held), or -1 for silence
let pendNote = -2, pendCount = 0;          // debounced candidate for the next note switch

let removeStreak = 0, playLogFrame = 0;
function resetDetection() { activeNote = -1; pendNote = -2; pendCount = 0; removeStreak = 0; playLogFrame = 0; }

// Live binarization overlay (screen-only diagnostic — never recorded): shows exactly which
// pixels pass the "lit" threshold, plus the centroid and chosen hole.
let showDetect = true;
const dbgCanvas = document.createElement("canvas"); dbgCanvas.width = PW; dbgCanvas.height = PH;
const dbgCtx = dbgCanvas.getContext("2d");
const dbgImg = dbgCtx.createImageData(PW, PH);
let dbg = { lit: false, cx: -1, cy: -1, winner: -1, mx: 0, bg: 0 };

// L = a detector result. In cover mode (L.dark) there is no full-frame mask (the box walls are all
// dark); the covered hole shows via its amber box + crosshair. In uncover mode the lit core is red.
function buildDetectOverlay(d, L, winner) {
  const data = dbgImg.data, N = PW * PH;
  for (let p = 0; p < N; p++) {
    const q = p * 4, v = lumaAt(d, p);
    const on = L.lit && (L.dark ? v <= L.coreThr : v >= L.coreThr);
    data[q]     = L.dark ? 60  : 255;
    data[q + 1] = L.dark ? 130 : 40;
    data[q + 2] = L.dark ? 255 : 40;
    data[q + 3] = on ? 210 : 0;
  }
  dbgCtx.putImageData(dbgImg, 0, 0);
  dbg.lit = L.lit; dbg.cx = L.cx; dbg.cy = L.cy; dbg.winner = winner; dbg.mx = L.mx; dbg.bg = Math.round(L.bg);
  $("dbgOut").textContent = L.lit
    ? `${L.dark ? "covered" : "lit"} • gap ${Math.round(L.gap)} • ${winner >= 0 ? NAMES[winner] : "no hole"}`
    : `${L.dark ? "no cover" : "silence"} • gap ${Math.round(L.gap)}`;
}

// UNCOVER mode: find the single brightest LIT spot and its centroid. Used by calibration always,
// and by play when the "cover to play" checkbox is off. `lit` is gated against the frame's OWN
// background so it survives auto-exposure drift; cx/cy are -1 when nothing qualifies.
// Returns {mx (the peak value), bg, lit, cx, cy, coreThr, dark:false}.
function findLight(d) {
  let sum = 0, mx = 0, mxp = 0;
  const N = PW * PH;
  for (let p = 0; p < N; p++) {
    const v = lumaAt(d, p);
    sum += v;
    if (v > mx) { mx = v; mxp = p; }
  }
  const bg = sum / N;
  const gated = mx >= SAT_FLOOR && (mx - bg) >= GAP_MIN / gain;
  const thr = mx - PEAK_BAND;
  let cx = -1, cy = -1;
  if (gated) {
    const gx = mxp % PW, gy = (mxp / PW) | 0;
    let sx = 0, sy = 0, n = 0;
    for (let y = Math.max(0, gy - CENTROID_R); y <= Math.min(PH - 1, gy + CENTROID_R); y++)
      for (let x = Math.max(0, gx - CENTROID_R); x <= Math.min(PW - 1, gx + CENTROID_R); x++)
        if (lumaAt(d, y * PW + x) >= thr) { sx += x; sy += y; n++; }
    if (n) { cx = sx / n; cy = sy / n; }
  }
  return { mx, bg, lit: gated && cx >= 0, cx, cy, coreThr: thr, dark: false };
}

// Mean luma of a small square window centred on (cx,cy) — used to sample a hole's brightness.
function windowMean(d, cx, cy, r) {
  const x0 = Math.max(0, Math.round(cx) - r), x1 = Math.min(PW - 1, Math.round(cx) + r);
  const y0 = Math.max(0, Math.round(cy) - r), y1 = Math.min(PH - 1, Math.round(cy) + r);
  let sum = 0, n = 0;
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) { sum += lumaAt(d, y * PW + x); n++; }
  return n ? sum / n : 0;
}

// COVER mode detection — HOLE-CENTRIC (not "darkest spot in the frame", which the dark box walls
// would always trip). It samples ONLY the calibrated hole positions and finds the one hole that has
// gone dark while the others stay lit. At rest every hole is lit, so nothing qualifies → silence.
// A hole counts as covered when it's dark in absolute terms (<= DARK_CEIL) AND clearly darker than
// the brightest still-lit hole (litRef - this hole >= GAP_MIN/gain). Returns the winning note or -1.
function detectCover(d) {
  const R = 4;
  let litRef = 0, minHb = 256, mi = -1;
  for (let i = 0; i < zones.length; i++) {
    const hb = windowMean(d, zones[i].cx, zones[i].cy, R);
    zones[i]._hb = hb;                       // stash for the overlay/log
    if (hb > litRef) litRef = hb;
    if (hb < minHb) { minHb = hb; mi = i; }
  }
  const covered = mi >= 0 && minHb <= DARK_CEIL && (litRef - minHb) >= GAP_MIN / gain;
  return { winner: covered ? zones[mi].note : -1, mi, minHb, litRef };
}

function playStep(d) {
  // NOTE: automatic removal is DISABLED — in a dark box auto-exposure amplifies the whole frame to
  // ~220, indistinguishable from "lifted out" by brightness alone, so it kept killing play.
  let L, winner = -1;

  if (coverMode) {
    // COVER: a hole plays when it's covered (goes dark). Hole-centric, so "no hole covered" is silent.
    const c = detectCover(d);
    winner = c.winner;
    const z = winner >= 0 ? zones[c.mi] : null;
    L = { dark: true, lit: winner >= 0, mx: Math.round(c.minHb), bg: c.litRef,
          cx: z ? z.cx : -1, cy: z ? z.cy : -1, coreThr: 0, gap: c.litRef - c.minHb };
  } else {
    // UNCOVER (default): a hole plays when it lights up; map the bright spot to the nearest hole.
    L = findLight(d);
    L.gap = L.mx - L.bg;
    if (L.lit && zones.length) {
      let best = Infinity;
      for (const z of zones) {
        const dx = L.cx - z.cx, dy = L.cy - z.cy, dd = dx * dx + dy * dy;
        if (dd < best) { best = dd; winner = z.note; }
      }
      if (best > MAX_MAP_DIST * MAX_MAP_DIST) winner = -1;   // light isn't near any hole
    }
  }
  const gap = L.gap;
  darkMean += DARK_EMA * (L.bg - darkMean);  // keep tracking exposure for diagnostics
  if (showDetect) buildDetectOverlay(d, L, winner);

  // Throttled diagnostic (~once per second): what the detector actually sees in play mode.
  // 'gap' is the contrast the active hole has vs the background; it must clear GAP_MIN (95/gain) to fire.
  if ((++playLogFrame % 30) === 0) {
    log("play tick", { mode: coverMode ? "cover" : "uncover", peak: L.mx, bg: Math.round(L.bg), gap: Math.round(gap), needGap: Math.round(GAP_MIN / gain), active: L.lit, winner: winner >= 0 ? NAMES[winner] : "-" });
  }

  // hold + temporal hysteresis: the active note sustains until a DIFFERENT winner
  //    (a different hole, or none) has persisted for SWITCH_FRAMES frames.
  if (winner === activeNote) { pendNote = -2; pendCount = 0; }
  else {
    if (winner === pendNote) pendCount++; else { pendNote = winner; pendCount = 1; }
    if (pendCount >= SWITCH_FRAMES) {
      const prev = activeNote;
      if (activeNote >= 0) noteOff(activeNote);
      activeNote = winner;
      if (activeNote >= 0) { noteOn(activeNote); recordReached(activeNote); }
      log("play: note " + (winner >= 0 ? "ON " + NAMES[winner] : "OFF (silence)"),
          { mode: coverMode ? "cover" : "uncover", from: prev >= 0 ? NAMES[prev] : "-", gap: Math.round(gap) });
      pendNote = -2; pendCount = 0;
    }
  }

  // 5. reflect on the key strip + overlay (only the one active hole lights up)
  for (const z of zones) {
    const on = z.note === activeNote;
    z.pressed = on;
    const k = keyEls[z.note];
    if (k) {
      k.classList.toggle("on", on);
      k.querySelector(".fill").style.height = on ? "100%" : "0%";
    }
  }
}

/* ---------- 10. render ---------- */
function render() {
  vctx.filter = `brightness(${gain})`;          // sensitivity gain amplifies the live footage (ISO-style)
  vctx.drawImage(video, 0, 0, view.width, view.height);
  vctx.filter = "none";                          // overlays stay crisp, unaffected by gain
  const sx = view.width / PW, sy = view.height / PH;

  // binarization overlay: the red mask is exactly the pixels the detector counts as "lit"
  if (showDetect && (mode === "play" || mode === "calibrate")) {
    vctx.imageSmoothingEnabled = false;
    vctx.globalAlpha = 0.5;
    vctx.drawImage(dbgCanvas, 0, 0, view.width, view.height);
    vctx.globalAlpha = 1;
  }

  vctx.lineWidth = 2; vctx.font = "bold 15px ui-monospace, monospace";
  for (const z of zones) {
    vctx.strokeStyle = z.pressed ? "#ffb63d" : "rgba(240,234,217,0.45)";
    vctx.strokeRect(z.x * sx, z.y * sy, z.w * sx, z.h * sy);
    vctx.fillStyle = z.pressed ? "#ffb63d" : "rgba(240,234,217,0.7)";
    vctx.fillText(z.name, z.x * sx + 3, z.y * sy - 4);
  }

  // green crosshair at the detected centroid — where the light was located this frame
  if (showDetect && (mode === "play" || mode === "calibrate") && dbg.lit && dbg.cx >= 0) {
    const px = dbg.cx * sx, py = dbg.cy * sy;
    vctx.strokeStyle = "#39ff88"; vctx.lineWidth = 2;
    vctx.beginPath();
    vctx.moveTo(px - 13, py); vctx.lineTo(px + 13, py);
    vctx.moveTo(px, py - 13); vctx.lineTo(px, py + 13);
    vctx.stroke();
  }
}

/* ---------- 11. main loop ---------- */
function loop() {
  if (video.readyState >= 2) {
    const d = grabFrame();
    if (mode === "calibrate") calibrationStep(d);
    else if (mode === "play") playStep(d);
    render();
  }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(loop);
  else requestAnimationFrame(loop);
}

/* ---------- 12. wiring ---------- */
$("startBtn").addEventListener("click", async () => {
  log("Start tapped — initialising audio + camera");
  initAudio();
  await actx.resume();
  log("audio context resumed", { state: actx.state, sampleRate: actx.sampleRate });
  rebuildVoices();
  decodeCalAudio();                          // pre-decode the success clip so it's ready at calibration
  decodeXyloSamples();                       // pre-decode the xylophone samples too
  const ok = await startCamera();
  if (!ok) { log("start aborted — camera failed"); return; }
  $("prompt").style.display = "none";
  $("calBtn").disabled = false;
  $("shotBtn").disabled = false;
  keepAwake();
  setStatus("camera on");
  setGuide(`Tap <b>Calibrate</b> to start the 10-second countdown, then close the box.`);
  log("main loop starting");
  loop();
});
document.querySelectorAll("#tabs .tab").forEach(btn => {
  btn.addEventListener("click", () => {
    const t = btn.dataset.tab;
    document.querySelectorAll("#tabs .tab").forEach(b => b.classList.toggle("active", b === btn));
    $("tab-play").hidden  = t !== "play";
    $("tab-notes").hidden = t !== "notes";
  });
});
$("detectBtn").addEventListener("click", detectCameras);
$("zoom").addEventListener("input", async e => {
  if (!curTrack) return;
  const z = +e.target.value;
  $("zoomOut").textContent = z.toFixed(1) + "×";
  try { await curTrack.applyConstraints({ advanced: [{ zoom: z }] }); log("zoom applied", { zoom: z }); }
  catch (err) { log("zoom failed", String(err && err.message || err)); }
});
$("facing").addEventListener("change", async () => {
  log("camera selection changed", { value: $("facing").value, cameraOn });
  if (!cameraOn) return;                            // not started yet — Start will use the selection
  errEl.style.display = "none";
  const ok = await startCamera();                   // swap the live camera
  if (!ok) return;
  zones = [];                                        // the view changed → old calibration is void
  cancelPlayCountdown();
  mode = "idle";
  setStatus("camera on");
  setGuide(`Camera switched — tap <b>Calibrate</b> to set it up.`);
});
$("calBtn").addEventListener("click", () => { log("Calibrate tapped"); decodeCalAudio(); startCountdown(10); });   // countdown → auto-calibrates at 0
$("shotBtn").addEventListener("click", () => { log("Take shot tapped"); startShotCountdown(5); }); // 5s countdown → single photo
$("toneBtn").addEventListener("click", () => {
  log("Test sound tapped", { hasAudio: !!actx });
  if (!actx) return;
  [0, 2, 4].forEach((n, j) => setTimeout(() => blip(Math.min(n, numKeys - 1), 0.2), j * 160));
});
$("numKeys").addEventListener("change", e => {
  numKeys = +e.target.value;
  log("key count changed", { numKeys });
  buildKeyStrip();
  if (actx) rebuildVoices();
  zones = [];
  cancelCountdown();
  cancelPlayCountdown();
  if (mode === "play" || mode === "calibrate" || mode === "ready") {
    mode = "idle"; setStatus("camera on");
    setGuide(`Key count changed — tap <b>Calibrate</b> again.`);
  }
});
$("sens").addEventListener("input", e => {
  // Sensitivity = light gain (ISO-style). value 8..60 maps to ~0.27x..2.0x, centred on 1.0x at 30.
  // The same gain brightens the on-screen footage (render) and scales the detected signal (playStep),
  // so what the user sees getting brighter is exactly what makes notes easier to trigger.
  gain = +e.target.value / 30;
  $("sensOut").textContent = gain.toFixed(2) + "×";
  log("sensitivity changed", { slider: +e.target.value, gain: +gain.toFixed(2) });
});
$("dbgChk").addEventListener("change", e => {
  showDetect = e.target.checked;
  log("detection overlay toggled", { showDetect });
  if (!showDetect) $("dbgOut").textContent = "—";
});
$("coverChk").addEventListener("change", e => {
  coverMode = e.target.checked;
  log("play trigger mode changed", { mode: coverMode ? "cover to play" : "uncover to play" });
});
$("soundSet").addEventListener("change", e => {
  soundset = e.target.value;
  if (soundset === "xylophone") decodeXyloSamples();   // ensure decoded (also decoded on Start)
  log("sound set changed", { soundset });
});
$("logBtn").addEventListener("click", downloadLogs);

buildKeyStrip();
log("app loaded", { version: APP_VERSION, numKeys });

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("./sw.js")
    .then(() => log("service worker registered"))
    .catch(err => log("service worker registration failed", String(err)));
}
</script>
</body>
</html>
